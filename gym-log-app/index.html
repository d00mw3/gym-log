<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4fd1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Gym Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column, phone-first. Accent borrows the blue of a 20 kg plate. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --ink:#141a22; --muted:#5a6575; --line:#d9dee6;
  --accent:#1f4fd1; --accent-soft:#e3eafc; --accent-ink:#ffffff;
  --good:#17784a; --good-soft:#dff3e8; --warn:#a9500f; --warn-soft:#fbeadc;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --surface:#171b22; --ink:#e8ecf2; --muted:#93a0b2; --line:#29303a;
    --accent:#6a95ff; --accent-soft:#1c2a4d; --accent-ink:#0b1020;
    --good:#53c486; --good-soft:#153324; --warn:#f29a5c; --warn-soft:#3a2416;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --surface:#171b22; --ink:#e8ecf2; --muted:#93a0b2; --line:#29303a;
  --accent:#6a95ff; --accent-soft:#1c2a4d; --accent-ink:#0b1020;
  --good:#53c486; --good-soft:#153324; --warn:#f29a5c; --warn-soft:#3a2416;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 140px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 0 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:700 26px/1 var(--display);letter-spacing:.02em;text-transform:uppercase}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok .dot{background:var(--good)} .sync.warn .dot{background:var(--warn)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.tab{border:0;background:transparent;padding:8px 0;border-radius:7px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
main{display:grid;gap:14px;padding-top:14px}
h2{font:700 30px/1 var(--display);margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
h3{font:600 20px/1.1 var(--display);margin:0;letter-spacing:.01em}
.muted{color:var(--muted)}
.small{font-size:13px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 18px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.up{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.low{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.new{background:var(--good-soft);color:var(--good);border-color:transparent}
.tip{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.tip p{margin:0}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;justify-self:start}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-num{font:700 15px/1 var(--display);color:var(--muted);margin-right:6px}
.target{font:600 15px/1.2 var(--body);font-variant-numeric:tabular-nums;white-space:nowrap}
.last{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);margin:0}
.ss{display:grid;gap:10px;border-left:3px solid var(--accent);padding-left:10px}
.ss-label{font:600 13px/1 var(--body);color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.sets{display:grid;gap:6px}
.setrow{display:grid;grid-template-columns:26px 1fr 14px 1fr;gap:8px;align-items:center}
.setno{font:700 16px/1 var(--display);color:var(--muted);text-align:center}
.field{position:relative}
.field input{width:100%;height:46px;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:0 40px 0 12px;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.field input::placeholder{color:var(--muted);opacity:.55;font-weight:500}
.field span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.setrow.done .field input{border-color:var(--accent);background:var(--surface)}
.times{color:var(--muted);text-align:center}
.ex-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:10px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{background:transparent;color:var(--warn);border-color:var(--warn)}
.btn.block{width:100%;padding:14px;font-size:16px}
.footer-actions{display:grid;gap:8px;margin-top:4px}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--ink);color:var(--bg);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.timer-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.timer-time{font:700 32px/1 var(--display);font-variant-numeric:tabular-nums;min-width:74px}
.timer-label{flex:1;font-size:13px;opacity:.8;line-height:1.25}
.timer button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:8px;padding:8px 10px;font-weight:600}
.timer-bar{position:absolute;left:0;top:0;height:3px;background:var(--accent);transition:width 1s linear}
.timer.over .timer-time{color:var(--accent)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden],.timer[hidden]{display:none}
.modal-card{background:var(--surface);color:var(--ink);border-radius:14px;padding:18px;max-width:380px;width:100%;display:grid;gap:14px}
.modal-card p{margin:0}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:15;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;max-width:90vw}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
select.sel{height:42px;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:0 10px;width:100%}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--body)}
.hist-list{display:grid;gap:4px;font-size:13px;font-variant-numeric:tabular-nums}
.hist-list div{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:4px}
details.sess{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
details.sess summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.sess summary::-webkit-details-marker{display:none}
.sess-body{display:grid;gap:6px;margin-top:10px;font-size:14px}
.sess-line{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:6px}
.sess-line b{font-weight:500}
.sess-line span{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.big{font:700 22px/1 var(--display)}
.plan-item{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.plan-item:first-of-type{border-top:0;padding-top:0}
.plan-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.plan-grid label,.plan-name label{display:grid;gap:2px;font-size:11px;color:var(--muted)}
.plan-grid input,.plan-name input{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 8px;width:100%;font-size:15px;color:var(--ink)}
.plan-row{display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.check{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.timer-bar{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="top-row">
      <div class="brand">Gym Log</div>
      <div id="sync" class="sync"><span class="dot"></span><span id="sync-text">Saved on this phone</span></div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-today" data-tab="today" aria-selected="true">Today</button>
      <button class="tab" role="tab" id="tab-history" data-tab="history" aria-selected="false">History</button>
      <button class="tab" role="tab" id="tab-plan" data-tab="plan" aria-selected="false">Plan</button>
    </div>
  </header>
  <main id="view"></main>
</div>

<div id="timer" class="timer" hidden>
  <div id="timer-bar" class="timer-bar"></div>
  <div class="timer-in">
    <div id="timer-time" class="timer-time">0:00</div>
    <div id="timer-label" class="timer-label">Rest</div>
    <button id="timer-add" type="button">+15s</button>
    <button id="timer-skip" type="button">Done</button>
  </div>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-text">
    <p id="modal-text"></p>
    <div class="modal-actions">
      <button id="modal-cancel" class="btn ghost" type="button">Cancel</button>
      <button id="modal-ok" class="btn" type="button">OK</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ---------- Recommended plan ---------- */
const DEFAULT_PLAN = {
  A: [
    {id:"squat", name:"Barbell Squat", sets:3, min:5, max:7, rest:150},
    {id:"dbrow", name:"One-Arm Dumbbell Row", sets:3, min:5, max:7, rest:90, perSide:true},
    {id:"incdb", name:"Incline Dumbbell Press", sets:3, min:5, max:7, rest:120},
    {id:"legcurl", name:"Lying Leg Curl", sets:3, min:8, max:10, rest:75},
    {id:"latraise", name:"Seated DB Lateral Raise", sets:2, min:10, max:12, rest:0, ss:"1"},
    {id:"pushdown", name:"Rope Tricep Pushdown", sets:2, min:10, max:12, rest:75, ss:"1", isNew:true},
    {id:"cablecurl", name:"Single-Arm Cable Curl", sets:2, min:8, max:10, rest:0, ss:"2", perSide:true},
    {id:"calf", name:"Leg Press Calf Raise", sets:3, min:8, max:10, rest:60, ss:"2"}
  ],
  B: [
    {id:"legpress", name:"Leg Press", sets:3, min:8, max:10, rest:120},
    {id:"pullup", name:"Overhand Pull-Up", sets:3, min:5, max:7, rest:120, bw:true, note:"Under 5 reps on a set? Finish with the lat pulldown below."},
    {id:"pulldown", name:"Lat Pulldown (backup)", sets:2, min:8, max:10, rest:75, optional:true},
    {id:"ohp", name:"Overhead Barbell Press", sets:3, min:5, max:7, rest:120},
    {id:"rdl", name:"Romanian Deadlift", sets:3, min:8, max:10, rest:120},
    {id:"fly", name:"Machine Fly", sets:2, min:8, max:10, rest:60},
    {id:"ohext", name:"Overhead Rope Extension", sets:2, min:8, max:10, rest:0, ss:"1"},
    {id:"ezcurl", name:"EZ-Bar Cable Curl", sets:2, min:10, max:12, rest:60, ss:"1", isNew:true},
    {id:"facepull", name:"Face Pull", sets:2, min:10, max:12, rest:0, ss:"2"},
    {id:"crunch", name:"Swiss Ball Crunch", sets:2, min:12, max:15, rest:60, ss:"2"}
  ]
};

/* ---------- State ---------- */
const LS_KEY = "gymlog.v1";
const clone = o => JSON.parse(JSON.stringify(o));
function loadLocal(){ try{ const s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
let state = loadLocal() || {};
state.plan = state.plan || clone(DEFAULT_PLAN);
state.planUpdatedAt = state.planUpdatedAt || 0;
state.sessions = state.sessions || [];
state.draft = state.draft || null;
state.draftUpdatedAt = state.draftUpdatedAt || 0;

let tab = "today";
let chosenWorkout = null;
let progressEx = null;
let db = null, uid = null, dbReady = false;

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null; };
const fmtKg = n => (Math.round(n * 100) / 100).toString();
const fmtDate = iso => new Date(iso).toLocaleDateString("en-GB", {weekday:"short", day:"numeric", month:"short"});
const fmtShort = iso => new Date(iso).toLocaleDateString("en-GB", {day:"numeric", month:"short"});
const fmtClock = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const sortedSessions = () => state.sessions.slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""));
const allItems = () => state.plan.A.concat(state.plan.B);
const findItem = id => allItems().find(i => i.id === id);

function nextWorkout(){
  const s = sortedSessions()[0];
  return s ? (s.workout === "A" ? "B" : "A") : "A";
}
function currentWorkout(){ return state.draft ? state.draft.workout : (chosenWorkout || nextWorkout()); }

function lastFor(exId){
  for (const s of sortedSessions()){
    const e = s.entries && s.entries[exId];
    if (e && e.sets && e.sets.length) return {date:s.date, sets:e.sets};
  }
  return null;
}
function setText(item, s){
  if (item && item.bw) return (s.kg ? "BW+" + fmtKg(s.kg) : "BW") + "×" + s.reps;
  return fmtKg(s.kg || 0) + "×" + s.reps;
}
function advice(item, last){
  if (!last) return null;
  const sets = last.sets;
  if (sets.length < item.sets) return {cls:"", text:"Aim for all " + item.sets + " sets"};
  if (sets.slice(0, item.sets).every(s => s.reps >= item.max)) return {cls:"up", text: item.bw ? "↑ Add weight" : "↑ Add weight"};
  if (sets.some(s => s.reps < item.min)) return {cls:"low", text:"Repeat weight"};
  return {cls:"", text:"Same weight, beat reps"};
}

/* ---------- Draft ---------- */
function ensureDraft(){
  if (!state.draft){
    state.draft = {workout: currentWorkout(), startedAt: new Date().toISOString(), entries:{}};
  }
  return state.draft;
}
function draftRows(item){
  const d = state.draft;
  const rows = d && d.entries[item.id];
  if (rows && rows.length) return rows;
  return Array.from({length:item.sets}, () => ({kg:"", reps:""}));
}
function draftHasData(){
  const d = state.draft; if (!d) return false;
  return Object.values(d.entries).some(rows => rows.some(r => String(r.kg).trim() || String(r.reps).trim()));
}
let draftTimer = null;
function touchDraft(){
  state.draftUpdatedAt = Date.now();
  saveLocal();
  clearTimeout(draftTimer);
  draftTimer = setTimeout(() => dbWrite("draft", {draft: state.draft, updatedAt: state.draftUpdatedAt}), 1500);
}

/* ---------- Rendering ---------- */
let needsRender = false;
function render(){
  if (document.activeElement && document.activeElement.matches("input") && document.activeElement.closest("#view")){
    needsRender = true; return;
  }
  needsRender = false;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  const v = $("#view");
  if (tab === "today") v.innerHTML = renderToday();
  else if (tab === "history") v.innerHTML = renderHistory();
  else v.innerHTML = renderPlan();
  updateElapsed();
}
function forceRender(){ needsRender = false; const a = document.activeElement; if (a && a.blur) a.blur(); render(); }

function renderToday(){
  const w = currentWorkout();
  const items = state.plan[w];
  const suggested = nextWorkout();
  let h = '<div class="hero"><div><div class="muted small">' + (state.draft ? 'In progress · <span id="elapsed">0:00</span>' : (w === suggested ? "Up next" : "Chosen manually")) + '</div><h2>Workout ' + w + '</h2></div>';
  h += '<div class="seg" role="group" aria-label="Choose workout"><button type="button" data-act="pick" data-w="A" aria-pressed="' + (w === "A") + '">A</button><button type="button" data-act="pick" data-w="B" aria-pressed="' + (w === "B") + '">B</button></div></div>';
  if (!state.tipDismissed){
    h += '<div class="tip"><p><b>Back after a break?</b> For the first 2 weeks, start at about 70% of your old weights and stop each set 2–3 reps short of failure.</p><p class="small muted">Then follow the badges: when you hit the top of the rep range on every set, add weight next time.</p><button type="button" class="linkbtn" data-act="dismisstip">Got it</button></div>';
  }
  let i = 0, idx = 0;
  while (i < items.length){
    const it = items[i];
    if (it.ss){
      const group = [];
      while (i < items.length && items[i].ss === it.ss){ group.push(items[i]); i++; }
      if (group.length > 1){
        h += '<div class="ss"><div class="ss-label">Superset · alternate, rest after the last</div>';
        group.forEach(g => { idx++; h += renderEx(g, idx); });
        h += '</div>';
      } else { idx++; h += renderEx(group[0], idx); }
    } else { idx++; h += renderEx(it, idx); i++; }
  }
  h += '<div class="footer-actions"><button type="button" class="btn block" data-act="finish">Finish workout</button>';
  if (state.draft) h += '<button type="button" class="btn ghost" data-act="discard">Discard this workout</button>';
  h += '</div>';
  return h;
}
function renderEx(item, idx){
  const last = lastFor(item.id);
  const adv = advice(item, last);
  const rows = draftRows(item);
  let h = '<section class="ex" data-ex="' + esc(item.id) + '">';
  h += '<div class="ex-head"><h3><span class="ex-num">' + idx + '</span>' + esc(item.name) + '</h3><div class="target">' + item.sets + ' × ' + item.min + '–' + item.max + '</div></div>';
  const chips = [];
  if (item.perSide) chips.push('<span class="chip">Per side · log one</span>');
  if (item.optional) chips.push('<span class="chip">Only if needed</span>');
  if (item.rest) chips.push('<span class="chip">Rest ' + fmtClock(item.rest) + '</span>');
  if (adv) chips.push('<span class="chip ' + adv.cls + '">' + adv.text + '</span>');
  if (item.isNew && !last) chips.push('<span class="chip new">New</span>');
  if (chips.length) h += '<div class="meta">' + chips.join("") + '</div>';
  if (item.note) h += '<p class="note">' + esc(item.note) + '</p>';
  h += '<div class="last">' + (last ? 'Last · ' + fmtShort(last.date) + ': ' + last.sets.map(s => setText(item, s)).join(", ") : 'No previous log') + '</div>';
  h += '<div class="sets">';
  rows.forEach((r, n) => {
    const prev = last && (last.sets[n] || last.sets[last.sets.length - 1]);
    const kgPh = prev ? (item.bw && !prev.kg ? "0" : fmtKg(prev.kg || 0)) : (item.bw ? "0" : "");
    const repPh = prev ? String(prev.reps) : (item.min + "–" + item.max);
    const done = String(r.reps).trim() !== "";
    const kid = "kg-" + item.id + "-" + n, rid = "reps-" + item.id + "-" + n;
    h += '<div class="setrow' + (done ? " done" : "") + '"><div class="setno">' + (n + 1) + '</div>';
    h += '<div class="field"><input id="' + esc(kid) + '" class="in" data-field="kg" data-ex="' + esc(item.id) + '" data-n="' + n + '" inputmode="decimal" autocomplete="off" aria-label="Set ' + (n + 1) + ' ' + (item.bw ? "added kg" : "kg") + '" placeholder="' + esc(kgPh) + '" value="' + esc(r.kg) + '"><span>' + (item.bw ? "+kg" : "kg") + '</span></div>';
    h += '<div class="times">×</div>';
    h += '<div class="field"><input id="' + esc(rid) + '" class="in" data-field="reps" data-ex="' + esc(item.id) + '" data-n="' + n + '" inputmode="numeric" autocomplete="off" aria-label="Set ' + (n + 1) + ' reps" placeholder="' + esc(repPh) + '" value="' + esc(r.reps) + '"><span>reps</span></div></div>';
  });
  h += '</div><div class="ex-actions"><button type="button" class="btn ghost sm" data-act="addset" data-ex="' + esc(item.id) + '">+ Set</button>';
  if (rows.length > 1) h += '<button type="button" class="btn ghost sm" data-act="rmset" data-ex="' + esc(item.id) + '">− Set</button>';
  if (last) h += '<button type="button" class="btn ghost sm" data-act="copylast" data-ex="' + esc(item.id) + '">Use last weights</button>';
  h += '</div></section>';
  return h;
}

function exerciseOptions(){
  const seen = new Map();
  allItems().forEach(i => seen.set(i.id, i.name));
  state.sessions.forEach(s => Object.entries(s.entries || {}).forEach(([id, e]) => { if (!seen.has(id)) seen.set(id, e.name || id); }));
  return seen;
}
function seriesFor(exId){
  const item = findItem(exId);
  return sortedSessions().reverse().filter(s => s.entries && s.entries[exId] && s.entries[exId].sets.length).map(s => {
    const sets = s.entries[exId].sets;
    const best = sets.reduce((b, x) => (!b || (x.kg || 0) > (b.kg || 0) || ((x.kg || 0) === (b.kg || 0) && x.reps > b.reps)) ? x : b, null);
    return {date:s.date, best, sets, item};
  });
}
function renderChart(series, item){
  if (series.length < 2) return '<p class="small muted">' + (series.length ? "Log one more session to see a trend." : "No sessions logged for this exercise yet.") + '</p>';
  const useReps = series.every(p => !(p.best.kg));
  const ys = series.map(p => useReps ? p.best.reps : p.best.kg);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (lo === hi){ lo = lo - 1; hi = hi + 1; }
  const W = 320, H = 150, L = 34, R = 10, T = 12, B = 24;
  const x = i => L + (W - L - R) * (series.length === 1 ? 0.5 : i / (series.length - 1));
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const pts = ys.map((v, i) => x(i).toFixed(1) + "," + y(v).toFixed(1));
  const unit = useReps ? " reps" : " kg";
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Best set per session">';
  [lo, hi].forEach(v => { s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line)" stroke-width="1"/><text x="' + (L - 4) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + fmtKg(v) + '</text>'; });
  s += '<polygon points="' + x(0) + ',' + (H - B) + ' ' + pts.join(" ") + ' ' + x(ys.length - 1) + ',' + (H - B) + '" fill="var(--accent-soft)"/>';
  s += '<polyline points="' + pts.join(" ") + '" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>';
  ys.forEach((v, i) => { const end = i === ys.length - 1; s += '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="' + (end ? 5 : 3) + '" fill="' + (end ? "var(--accent)" : "var(--surface)") + '" stroke="var(--accent)" stroke-width="2"/>'; });
  s += '<text x="' + x(0) + '" y="' + (H - 6) + '" text-anchor="start">' + fmtShort(series[0].date) + '</text>';
  s += '<text x="' + x(ys.length - 1) + '" y="' + (H - 6) + '" text-anchor="end">' + fmtShort(series[series.length - 1].date) + '</text>';
  s += '</svg><p class="small muted">Best set each session, in' + unit + '.</p>';
  return s;
}
function renderHistory(){
  const sessions = sortedSessions();
  const opts = exerciseOptions();
  if (!progressEx || !opts.has(progressEx)){
    progressEx = [...opts.keys()].find(id => lastFor(id)) || [...opts.keys()][0];
  }
  const item = findItem(progressEx) || {name: opts.get(progressEx)};
  const series = seriesFor(progressEx);
  let h = '<h2>Progress</h2><div class="card"><label for="progress-ex" class="small muted">Exercise</label><select id="progress-ex" class="sel">';
  opts.forEach((name, id) => { h += '<option value="' + esc(id) + '"' + (id === progressEx ? " selected" : "") + '>' + esc(name) + '</option>'; });
  h += '</select><div class="chart">' + renderChart(series, item) + '</div>';
  if (series.length){
    h += '<div class="hist-list">' + series.slice(-5).reverse().map(p => '<div><span>' + fmtDate(p.date) + '</span><span>' + p.sets.map(s => setText(item, s)).join(", ") + '</span></div>').join("") + '</div>';
  }
  h += '</div>' + renderBackup() + '<h2>Sessions</h2>';
  if (!sessions.length) return h + '<div class="card empty">No workouts saved yet. Each one appears here after you tap <b>Finish workout</b>.</div>';
  sessions.forEach(s => {
    const entries = Object.entries(s.entries || {});
    const setCount = entries.reduce((n, [, e]) => n + e.sets.length, 0);
    const mins = s.finishedAt && s.startedAt ? Math.round((new Date(s.finishedAt) - new Date(s.startedAt)) / 60000) : null;
    h += '<details class="sess"><summary><div><div class="big">Workout ' + esc(s.workout) + '</div><div class="small muted">' + fmtDate(s.date) + (mins != null ? ' · ' + mins + ' min' : '') + ' · ' + setCount + (setCount === 1 ? ' set' : ' sets') + '</div></div><span class="chip">' + (s.synced === false ? "On phone" : "Saved") + '</span></summary><div class="sess-body">';
    entries.forEach(([id, e]) => { const it = findItem(id); h += '<div class="sess-line"><b>' + esc(e.name || (it && it.name) || id) + '</b><span>' + e.sets.map(x => setText(it || {bw:e.bw}, x)).join(", ") + '</span></div>'; });
    h += '<div><button type="button" class="btn danger sm" data-act="delsession" data-id="' + esc(s.id) + '">Delete session</button></div></div></details>';
  });
  return h;
}
function renderPlan(){
  let h = '<h2>Plan</h2><p class="small muted" style="margin:0">Changes save automatically. Exercises with the same superset number, next to each other, are grouped and alternated. Rest is in seconds.</p>';
  ["A", "B"].forEach(w => {
    h += '<div class="card"><h3>Workout ' + w + '</h3>';
    state.plan[w].forEach((it, i) => {
      const p = 'data-w="' + w + '" data-i="' + i + '"';
      const base = "p-" + w + "-" + i;
      h += '<div class="plan-item"><div class="plan-name"><label for="' + base + '-name">Exercise<input id="' + base + '-name" class="pin" ' + p + ' data-k="name" value="' + esc(it.name) + '"></label></div>';
      h += '<div class="plan-grid">';
      [["sets","Sets"],["min","Min reps"],["max","Max reps"],["rest","Rest s"],["ss","Superset"]].forEach(([k, lab]) => {
        h += '<label for="' + base + '-' + k + '">' + lab + '<input id="' + base + '-' + k + '" class="pin" ' + p + ' data-k="' + k + '" inputmode="numeric" value="' + esc(it[k] == null ? "" : it[k]) + '"></label>';
      });
      h += '</div><div class="plan-row"><div class="meta"><label class="check" for="' + base + '-ps"><input type="checkbox" id="' + base + '-ps" class="pin" ' + p + ' data-k="perSide"' + (it.perSide ? " checked" : "") + '>Per side</label><label class="check" for="' + base + '-bw"><input type="checkbox" id="' + base + '-bw" class="pin" ' + p + ' data-k="bw"' + (it.bw ? " checked" : "") + '>Bodyweight</label></div>';
      h += '<div class="meta"><button type="button" class="btn ghost sm" data-act="up" ' + p + ' aria-label="Move up">↑</button><button type="button" class="btn ghost sm" data-act="down" ' + p + ' aria-label="Move down">↓</button><button type="button" class="btn danger sm" data-act="rmitem" ' + p + '>Remove</button></div></div></div>';
    });
    h += '<button type="button" class="btn ghost" data-act="additem" data-w="' + w + '">+ Add exercise</button></div>';
  });
  h += '<button type="button" class="btn ghost" data-act="resetplan">Reset to recommended plan</button>';
  return h;
}

/* ---------- Elapsed + rest timer ---------- */
function updateElapsed(){
  const el = $("#elapsed");
  if (el && state.draft) el.textContent = fmtClock((Date.now() - new Date(state.draft.startedAt)) / 1000);
}
let rest = null; // {end, total, label}
let audioCtx = null;
function beep(){
  try{
    if (!audioCtx) return;
    [0, 0.25].forEach(t => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.25, audioCtx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + 0.18);
      o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.2);
    });
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([200, 100, 200]); }catch(e){}
}
function startRest(seconds, label){
  rest = {end: Date.now() + seconds * 1000, total: seconds, label, beeped:false};
  $("#timer").hidden = false;
  tickRest();
}
function tickRest(){
  if (!rest) return;
  const left = (rest.end - Date.now()) / 1000;
  const t = $("#timer");
  if (left <= 0){
    $("#timer-time").textContent = "Go";
    $("#timer-label").textContent = "Rest done · next set";
    $("#timer-bar").style.width = "100%";
    t.classList.add("over");
    if (!rest.beeped){ rest.beeped = true; beep(); }
    if (left < -20){ stopRest(); }
    return;
  }
  t.classList.remove("over");
  $("#timer-time").textContent = fmtClock(left);
  $("#timer-label").textContent = rest.label;
  $("#timer-bar").style.width = (100 * (1 - left / rest.total)) + "%";
}
function stopRest(){ rest = null; $("#timer").hidden = true; }
setInterval(() => { tickRest(); updateElapsed(); }, 1000);
$("#timer-add").addEventListener("click", () => { if (rest){ rest.end = Math.max(rest.end, Date.now()) + 15000; rest.total += 15; rest.beeped = false; tickRest(); } });
$("#timer-skip").addEventListener("click", stopRest);
document.addEventListener("pointerdown", () => {
  try{ if (!audioCtx){ const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); } else if (audioCtx.state === "suspended") audioCtx.resume(); }catch(e){}
}, {passive:true});

/* ---------- Modal + toast ---------- */
function ask(text, okLabel, danger){
  return new Promise(res => {
    const m = $("#modal"), ok = $("#modal-ok"), cancel = $("#modal-cancel");
    $("#modal-text").textContent = text;
    ok.textContent = okLabel || "OK";
    ok.className = danger ? "btn danger" : "btn";
    cancel.hidden = okLabel === null;
    m.hidden = false; ok.focus();
    const done = v => { m.hidden = true; ok.onclick = cancel.onclick = null; res(v); };
    ok.onclick = () => done(true); cancel.onclick = () => done(false);
  });
}
let toastTimer = null;
function toast(msg){
  let t = $(".toast"); if (!t){ t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}

/* ---------- Events ---------- */
document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  tab = b.dataset.tab; forceRender(); window.scrollTo(0, 0);
});
const view = $("#view");
view.addEventListener("input", e => {
  const inp = e.target;
  if (inp.classList.contains("in")){
    const d = ensureDraft();
    const item = findItem(inp.dataset.ex); if (!item) return;
    if (!d.entries[item.id]) d.entries[item.id] = draftRows(item).map(r => ({...r}));
    const rows = d.entries[item.id];
    const n = +inp.dataset.n;
    while (rows.length <= n) rows.push({kg:"", reps:""});
    rows[n][inp.dataset.field] = inp.value;
    inp.closest(".setrow").classList.toggle("done", String(rows[n].reps).trim() !== "");
    touchDraft();
  }
});
view.addEventListener("change", e => {
  const inp = e.target;
  if (inp.classList.contains("in") && inp.dataset.field === "reps" && inp.value.trim()){
    const item = findItem(inp.dataset.ex);
    if (item && item.rest > 0) startRest(item.rest, "Rest · " + item.name);
    else if (item && item.ss) toast("Superset: go straight to the next exercise");
  }
  if (inp.classList.contains("pin")) updatePlanField(inp);
  if (inp.id === "progress-ex"){ progressEx = inp.value; forceRender(); }
});
view.addEventListener("focusout", () => { setTimeout(() => { if (needsRender) render(); }, 0); });
view.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "pick"){
    const w = b.dataset.w;
    if (state.draft && state.draft.workout !== w){
      if (draftHasData() && !(await ask("Switch to Workout " + w + "? The sets you've entered for Workout " + state.draft.workout + " will be cleared.", "Switch", true))) return;
      state.draft = null; touchDraft();
    }
    chosenWorkout = w; forceRender();
  } else if (act === "dismisstip"){
    state.tipDismissed = true; saveLocal(); forceRender();
  } else if (act === "addset" || act === "rmset" || act === "copylast"){
    const item = findItem(b.dataset.ex); if (!item) return;
    const d = ensureDraft();
    if (!d.entries[item.id]) d.entries[item.id] = draftRows(item).map(r => ({...r}));
    const rows = d.entries[item.id];
    if (act === "addset"){ const lastRow = rows[rows.length - 1]; rows.push({kg: lastRow ? lastRow.kg : "", reps:""}); }
    else if (act === "rmset"){ if (rows.length > 1) rows.pop(); }
    else { const last = lastFor(item.id); if (last) rows.forEach((r, n) => { const p = last.sets[n] || last.sets[last.sets.length - 1]; r.kg = fmtKg(p.kg || 0); }); }
    touchDraft(); forceRender();
  } else if (act === "finish"){
    finishWorkout();
  } else if (act === "discard"){
    if (await ask("Discard everything you've entered for this workout?", "Discard", true)){ state.draft = null; chosenWorkout = null; touchDraft(); stopRest(); forceRender(); }
  } else if (act === "delsession"){
    if (await ask("Delete this session? This can't be undone.", "Delete", true)){
      const id = b.dataset.id;
      state.sessions = state.sessions.filter(s => s.id !== id);
      saveLocal(); dbWrite(id, null); forceRender();
    }
  } else if (act === "up" || act === "down" || act === "rmitem"){
    const list = state.plan[b.dataset.w], i = +b.dataset.i;
    if (act === "rmitem"){ if (!(await ask("Remove " + list[i].name + " from Workout " + b.dataset.w + "? Past logs are kept.", "Remove", true))) return; list.splice(i, 1); }
    else { const j = act === "up" ? i - 1 : i + 1; if (j < 0 || j >= list.length) return; [list[i], list[j]] = [list[j], list[i]]; }
    planChanged(); forceRender();
  } else if (act === "additem"){
    state.plan[b.dataset.w].push({id:"x" + Date.now().toString(36), name:"New exercise", sets:3, min:8, max:10, rest:90});
    planChanged(); forceRender();
  } else if (act === "resetplan"){
    if (await ask("Reset both workouts to the recommended plan? Your logged sessions are kept.", "Reset", true)){ state.plan = clone(DEFAULT_PLAN); planChanged(); forceRender(); }
  }
});
function updatePlanField(inp){
  const it = state.plan[inp.dataset.w][+inp.dataset.i]; if (!it) return;
  const k = inp.dataset.k;
  if (k === "perSide" || k === "bw") it[k] = inp.checked;
  else if (k === "name") it.name = inp.value.trim() || it.name;
  else if (k === "ss"){ const v = inp.value.trim(); if (v) it.ss = v; else delete it.ss; }
  else { const n = parseInt(inp.value, 10); if (isFinite(n) && n >= 0) it[k] = n; }
  if (it.min > it.max) it.max = it.min;
  planChanged();
}
function planChanged(){
  state.planUpdatedAt = Date.now(); saveLocal();
  dbWrite("plan", {plan: state.plan, updatedAt: state.planUpdatedAt});
}
async function finishWorkout(){
  const d = state.draft;
  const entries = {};
  if (d){
    Object.entries(d.entries).forEach(([id, rows]) => {
      const item = findItem(id);
      const sets = rows.map(r => ({kg: num(r.kg) || 0, reps: num(r.reps)})).filter(s => s.reps != null && s.reps > 0);
      if (sets.length) entries[id] = {name: item ? item.name : id, bw: !!(item && item.bw), sets};
    });
  }
  if (!Object.keys(entries).length){ await ask("Nothing to save yet. Enter reps for at least one set first.", "OK"); return; }
  const count = Object.values(entries).reduce((n, e) => n + e.sets.length, 0);
  if (!(await ask("Finish Workout " + d.workout + " and save " + count + " sets?", "Save workout"))) return;
  const now = new Date().toISOString();
  const s = {id: "s-" + Date.now(), workout: d.workout, date: d.startedAt, startedAt: d.startedAt, finishedAt: now, entries};
  state.sessions.push(s);
  state.draft = null; chosenWorkout = null;
  touchDraft(); clearTimeout(draftTimer); dbWrite("draft", {draft:null, updatedAt: state.draftUpdatedAt});
  pushSession(s);
  stopRest();
  forceRender(); window.scrollTo(0, 0);
  toast("Saved. Next time: Workout " + nextWorkout());
}

/* ---------- Offline storage + backup ---------- */
function setSync(){
  const el = $("#sync"); el.className = "sync ok";
  $("#sync-text").textContent = "Saved on this phone";
}
function dbWrite(){}
function pushSession(){}
function renderBackup(){
  const n = state.sessions.length;
  const since = state.lastBackup ? state.sessions.filter(s => (s.finishedAt || s.date) > state.lastBackup).length : n;
  let h = '<h2>Backup</h2><div class="card"><p class="small" style="margin:0">Your workouts are stored on this phone only. Save a backup every few weeks, for example to iCloud Drive, so a new phone or a cleared browser doesn\'t lose them.</p>';
  h += '<p class="small muted" style="margin:0">' + (state.lastBackup ? 'Last backup: ' + fmtDate(state.lastBackup) + ' · ' + since + ' new session' + (since === 1 ? '' : 's') + ' since' : 'No backup saved yet') + '</p>';
  h += '<div class="ex-actions"><button type="button" class="btn sm" data-act="export">Save backup</button><button type="button" class="btn ghost sm" data-act="import">Restore from backup</button></div>';
  h += '<input type="file" id="import-file" accept="application/json,.json" hidden></div>';
  return h;
}
async function exportBackup(){
  const data = JSON.stringify({app:"gymlog", version:1, exportedAt:new Date().toISOString(), plan:state.plan, sessions:state.sessions});
  const name = "gym-log-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  let file;
  try{ file = new File([data], name, {type:"application/json"}); }catch(e){ file = new Blob([data], {type:"application/json"}); }
  let shared = false;
  try{
    if (navigator.canShare && file instanceof File && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"Gym Log backup"}); shared = true; }
  }catch(e){ if (e && e.name === "AbortError") return; }
  if (!shared){
    const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }
  state.lastBackup = new Date().toISOString(); saveLocal(); forceRender();
  toast("Backup created");
}
async function importBackup(fileObj){
  try{
    const data = JSON.parse(await fileObj.text());
    if (!data || data.app !== "gymlog" || !Array.isArray(data.sessions)) throw new Error("bad");
    const have = new Set(state.sessions.map(s => s.id));
    const add = data.sessions.filter(s => s && s.id && !have.has(s.id));
    if (!(await ask("Restore " + add.length + " session" + (add.length === 1 ? "" : "s") + " and the saved plan from this backup? Sessions already on this phone are kept.", "Restore"))) return;
    state.sessions = state.sessions.concat(add);
    if (data.plan && data.plan.A && data.plan.B){ state.plan = data.plan; state.planUpdatedAt = Date.now(); }
    saveLocal(); forceRender(); toast("Restored " + add.length + " sessions");
  }catch(e){ await ask("That file isn't a Gym Log backup. Choose a file named gym-log-backup-….json.", "OK"); }
}
view.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.dataset.act === "export") exportBackup();
  if (b.dataset.act === "import"){ const f = $("#import-file"); if (f){ f.value = ""; f.click(); } }
});
view.addEventListener("change", e => {
  if (e.target.id === "import-file" && e.target.files && e.target.files[0]) importBackup(e.target.files[0]);
});
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
if ("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}

setSync();
render();
</script>
